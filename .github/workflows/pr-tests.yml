name: PR Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  NODE_VERSION: '24.22.1'
  GRADLE_VERSION: '9.3.1'
  ANDROID_CMDLINE_TOOLS: '13114758'
  TZ: Asia/Shanghai
  UV_USE_IO_URING: '0'

jobs:
  plan:
    name: Classify changes
    # External PRs are handled by PR Gate, without spending a test runner on their code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test exemption and gate policy
        run: node --test .github/scripts/pr-tests/*.test.mjs
      - name: Classify the complete PR diff
        id: plan
        run: node .github/scripts/pr-tests/policy.mjs plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  light:
    name: Lightweight checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate documentation and bundled help
        run: |
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
          python3 -m unittest discover -s app/tool -p test_guide_sync.py
          node sdk/plugin-kit/scripts/sync-skill.mjs --check
          node --test sdk/plugin-kit/test/skill.test.js

  flutter:
    name: Flutter app
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install pinned golden-test fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk=1:20230817+repack1-3 fonts-noto-cjk-extra=1:20230817+repack1-3 fonts-noto-color-emoji=2.047-0ubuntu0.24.04.1
          sudo install -Dm644 /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
          test -s /usr/share/fonts/noto/NotoColorEmoji.ttf
          for weight in Light Regular Bold; do
            test -s "$DSH_TEST_FONT_DIR/NotoSansCJK-$weight.ttc"
          done
      - name: Prepare dependencies and check generated localization
        run: |
          python3 tool/l10n_merge.py --no-gen
          flutter pub get --enforce-lockfile
          python3 tool/l10n_merge.py
          git diff --exit-code -- pubspec.lock lib/l10n/app_zh.arb lib/l10n/app_en.arb lib/l10n/gen
      - run: flutter analyze --no-pub
      - name: Run the complete default Flutter suite, including checked-in goldens
        run: flutter test --no-pub --concurrency=2 --reporter expanded
      - name: Keep synthetic golden failure comparisons
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-golden-failures
          path: app/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 7

  dart:
    name: Dart packages
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Test the full client package
        working-directory: packages/dsh_client
        run: |
          dart pub get --enforce-lockfile
          dart analyze
          dart test
          git diff --exit-code -- pubspec.lock
      - name: Test the full remote package
        working-directory: packages/dsh_remote
        run: |
          dart pub get --enforce-lockfile
          dart analyze
          dart test
          git diff --exit-code -- pubspec.lock

  sdk:
    name: Plugin SDK
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dev tools and run all SDK tests
        run: node .github/scripts/pr-tests/node-suites.mjs sdk

  runtime:
    name: Patched runtime and host integration
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install a disposable DSH tree and verify every runtime patch pin
        run: bash .github/scripts/pr-tests/setup-runtime.sh
      - name: Run all runtime and engine-auth unit tests
        run: |
          node --test runtime/tests/*.test.mjs app/tool/engine_auth/*.test.mjs
          python3 -I runtime/tests/test_patch_dsh.py
      - name: Run media and all example-plugin default tests
        run: node .github/scripts/pr-tests/node-suites.mjs runtime
      - name: Run route-guard and native bridge host integration
        run: |
          bash runtime/tests/run-guard-tests.sh "$DSH_PREFIX"
          bash runtime/tests/run-native-tests.sh "$DSH_PREFIX"

  web:
    name: Sites, market and share worker
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prepare shell tools used by offline stats fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl bsdextrautils
      - name: Check and generate the shared viewer inputs
        run: |
          python3 app/tool/make_replay_viewer.py --check
          python3 app/tool/make_replay_viewer.py
          git diff --exit-code -- app/lib/share_code/replay_viewer.g.dart
          node --test site/share/test/viewer_test.mjs
      - name: Run site content, market unit and share-worker build/type/tests
        run: node .github/scripts/pr-tests/node-suites.mjs web

  python:
    name: Python tooling and asset tests
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare image test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/test-python"
          "$RUNNER_TEMP/test-python/bin/pip" install Pillow==13.0.0 numpy==2.4.0
          echo "$RUNNER_TEMP/test-python/bin" >> "$GITHUB_PATH"
      - name: Test all Python tooling
        run: |
          python3 -m unittest discover -s tooling -p 'test_*.py'
          python3 -m unittest discover -s runtime/tests -p 'test_*.py'
          python3 -m unittest discover -s app/tool -p 'test_*.py'

  android:
    name: Android JVM tests
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS }}
          packages: platform-tools
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter plugins and Android local configuration
        working-directory: app
        run: |
          python3 tool/l10n_merge.py --no-gen
          flutter pub get --enforce-lockfile
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('android/local.properties').write_text(
              f'sdk.dir={os.environ["ANDROID_HOME"]}\nflutter.sdk={os.environ["FLUTTER_ROOT"]}\n', encoding='utf-8')
          PY
      # gradlew and its jar are ignored in this repository; pub get does not recreate them.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run all JVM unit tests for both debug flavors
        working-directory: app/android
        run: gradle --no-daemon --stacktrace --max-workers=2 :app:testArm64DebugUnitTest :app:testX64DebugUnitTest

  gate:
    name: PR test gate
    if: ${{ always() }}
    needs: [plan, light, flutter, dart, sdk, runtime, python, android, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject external pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'External pull requests are not accepted; use an issue for suggestions.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enforce the test plan without treating skipped tests as executed
        run: node .github/scripts/pr-tests/policy.mjs gate
        env:
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
          JOB_RESULTS: ${{ toJSON(needs) }}
