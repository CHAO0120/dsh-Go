# reverse temp branch only (request 039). Not product; never merged.
# Same toolchain preparation as ci.yml's "Android JVM" job (Java 17, Flutter 3.47.7, pub get
# --enforce-lockfile, local.properties, Gradle 9.3.1), then exactly the three requested commands,
# once each, plus read-only reporting of the merged manifest this run produced.
name: reverse core19 039

on:
  push:
    branches: [reverse/core19-039-candidate]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  android:
    name: Request 039 compile and dependency evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSH_MAVEN_MIRRORS: 0 # same as ci.yml's Android JVM job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Toolchain and tree identity (reporting only)
        run: |
          set +e
          echo "HEAD=$(git rev-parse HEAD)"
          git status --porcelain -- app/pubspec.lock | sed 's/^/PUBSPEC_LOCK_STATUS /'; echo "PUBSPEC_LOCK_UNCHANGED=$(git diff --quiet -- app/pubspec.lock && echo yes || echo no)"
          sha256sum app/pubspec.lock | sed 's/^/PUBSPEC_LOCK /'
          sha256sum app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/update/ApkInstaller.kt app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/icons/PictureShortcutPlugin.kt | sed 's/^/SRC /'
          java -version 2>&1 | sed 's/^/JAVA_VERSION /'
          flutter --version 2>&1 | sed 's/^/FLUTTER_VERSION /'
          command -v gradle | sed 's/^/GRADLE_BIN /'
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls build app/build app/android/app/build 2>&1 | sed 's/^/PRE_BUILD_DIRS /'
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/marker"; touch "$RUNNER_TEMP/marker"
          exit 0
      - name: Command 1 gradle --stacktrace :app:compileArm64DebugKotlin
        id: cmd1
        working-directory: app/android
        run: |
          set +e
          echo "=== CMD1 BEGIN $(date -u +%Y-%m-%dT%H:%M:%SZ) cwd=$(pwd)"
          gradle --stacktrace :app:compileArm64DebugKotlin
          rc=$?
          echo "=== CMD1 END $(date -u +%Y-%m-%dT%H:%M:%SZ) CMD1_EXIT=$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Command 2 gradle --offline dependencyInsight arm64DebugCompileClasspath
        if: ${{ !cancelled() }}
        working-directory: app/android
        run: |
          set +e
          echo "=== CMD2 BEGIN $(date -u +%Y-%m-%dT%H:%M:%SZ) cwd=$(pwd)"
          gradle --offline :app:dependencyInsight --configuration arm64DebugCompileClasspath --dependency androidx.core:core
          rc=$?
          echo "=== CMD2 END $(date -u +%Y-%m-%dT%H:%M:%SZ) CMD2_EXIT=$rc"
          exit 0
      - name: Command 3 gradle --offline dependencyInsight arm64DebugRuntimeClasspath
        if: ${{ !cancelled() }}
        working-directory: app/android
        run: |
          set +e
          echo "=== CMD3 BEGIN $(date -u +%Y-%m-%dT%H:%M:%SZ) cwd=$(pwd)"
          gradle --offline :app:dependencyInsight --configuration arm64DebugRuntimeClasspath --dependency androidx.core:core
          rc=$?
          echo "=== CMD3 END $(date -u +%Y-%m-%dT%H:%M:%SZ) CMD3_EXIT=$rc"
          exit 0
      - name: Merged manifest produced by this run (read-only)
        if: ${{ !cancelled() }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/manifests"
          find . -path ./.git -prune -o -type f -name 'AndroidManifest.xml' -path '*arm64Debug*' -newer "$RUNNER_TEMP/marker" -print 2>/dev/null | sort > "$RUNNER_TEMP/manifest-list.txt"
          echo "MANIFESTS_NEWER_THAN_CMD1_START=$(wc -l < "$RUNNER_TEMP/manifest-list.txt")"
          while read -r f; do
            echo "MANIFEST $(sha256sum "$f" | cut -c1-64) $(stat -c '%s %y' "$f") $f"
            d="$RUNNER_TEMP/manifests/$(echo "${f#./}" | tr '/' '__')"; cp "$f" "$d"
          done < "$RUNNER_TEMP/manifest-list.txt"
          python3 -I - "$RUNNER_TEMP/manifest-list.txt" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          A = '{http://schemas.android.com/apk/res/android}'
          for f in open(sys.argv[1]).read().split():
              try:
                  r = ET.parse(f).getroot()
              except Exception as e:
                  print('PARSE_FAIL', f, e); continue
              print('FILE', f, 'package=' + str(r.get('package')))
              for tag in ('permission', 'uses-permission'):
                  for el in r.findall(tag):
                      name = el.get(A + 'name') or ''
                      if name.endswith('DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'):
                          print('  ELEMENT <%s> %s' % (tag, ' '.join('%s="%s"' % (k.replace(A, 'android:'), v) for k, v in el.attrib.items())))
          PYEOF
          exit 0
      - name: Upload merged manifests (reverse temp branch only)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverse-039-arm64Debug-manifests
          path: ${{ runner.temp }}/manifests
          if-no-files-found: warn
          retention-days: 7
      - name: Keep command 1's real result as the job result
        if: ${{ !cancelled() && steps.cmd1.outputs.rc != '0' }}
        run: exit 1
