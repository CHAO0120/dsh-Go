# One-off verification build for the pid-namespace recovery backport (branch pidns-fix).
name: PIDNS build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  DSH_MAVEN_MIRRORS: 0
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1, same as ci.yml
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build the bundled runtime (arm64)
        env:
          UPDATE_DEB_LOCK: 1 # noble lock pins ca-certificates *.1, the mirrors only carry *.2 now
        run: runtime/build-runtime.sh arm64-v8a

      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Android JVM unit tests (compiles the patched Kotlin)
        working-directory: app/android
        run: gradle --stacktrace :app:testArm64DebugUnitTest

      - name: Assemble debug APK
        working-directory: app/android
        run: gradle --stacktrace :app:assembleArm64Debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-pidns-fix-arm64-debug
          path: app/android/app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          retention-days: 14
