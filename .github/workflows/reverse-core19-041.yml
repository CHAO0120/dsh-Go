# reverse temp branch only (request 041). Not product; never merged.
# Same toolchain preparation as request 039 / ci.yml's "Android JVM" job (Java 17, Flutter 3.47.7,
# pub get --enforce-lockfile, local.properties, Gradle 9.3.1), then exactly one requested gradle
# command, plus read-only collection of the :app manifest outputs and merger reports it produced.
name: reverse core19 041

on:
  push:
    branches: [reverse/core19-041-manifest]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  android:
    name: Request 041 arm64Debug merged manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSH_MAVEN_MIRRORS: 0 # same as ci.yml's Android JVM job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Toolchain and tree identity (reporting only)
        run: |
          set +e
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PUBSPEC_LOCK_UNCHANGED=$(git diff --quiet -- app/pubspec.lock && echo yes || echo no)"
          sha256sum app/pubspec.lock | sed 's/^/PUBSPEC_LOCK /'
          sha256sum app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/update/ApkInstaller.kt app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/icons/PictureShortcutPlugin.kt app/android/app/src/main/AndroidManifest.xml | sed 's/^/SRC /'
          echo "UID=$(id -u) GID=$(id -g) USER=$(id -un)"
          uname -srm | sed 's/^/KERNEL /'
          grep PRETTY_NAME /etc/os-release
          java -version 2>&1 | sed 's/^/JAVA_VERSION /'
          flutter --version 2>&1 | sed 's/^/FLUTTER_VERSION /'
          command -v gradle | sed 's/^/GRADLE_BIN /'
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls build app/build 2>&1 | sed 's/^/PRE_BUILD_DIRS /'
          touch "$RUNNER_TEMP/marker"; echo "MARKER $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit 0
      - name: Command gradle --stacktrace :app:processArm64DebugManifest
        id: cmd
        working-directory: app/android
        run: |
          set +e
          echo "=== CMD BEGIN $(date -u +%Y-%m-%dT%H:%M:%SZ) cwd=$(pwd)"
          gradle --stacktrace :app:processArm64DebugManifest
          rc=$?
          echo "=== CMD END $(date -u +%Y-%m-%dT%H:%M:%SZ) CMD_EXIT=$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: App manifest outputs and merger reports produced by this run (read-only)
        if: ${{ !cancelled() }}
        working-directory: app/android
        run: |
          set +e
          O="$RUNNER_TEMP/manifest"; mkdir -p "$O"
          find .. -type f -name 'AndroidManifest.xml' -newer "$RUNNER_TEMP/marker" 2>/dev/null | sort > "$RUNNER_TEMP/all-manifests.txt"
          echo "ALL_MODULE_MANIFESTS_NEWER_THAN_MARKER=$(wc -l < "$RUNNER_TEMP/all-manifests.txt")"
          sed 's/^/ANY /' "$RUNNER_TEMP/all-manifests.txt"
          find ../build/app -type f -newer "$RUNNER_TEMP/marker" \( -ipath '*manifest*' \) 2>/dev/null | sort > "$RUNNER_TEMP/app-files.txt"
          echo "APP_MANIFEST_FILES=$(wc -l < "$RUNNER_TEMP/app-files.txt")"
          while read -r f; do
            echo "APPFILE $(sha256sum "$f" | cut -c1-64) $(stat -c '%s %y' "$f") $f"
            r="${f#../build/app/}"; mkdir -p "$O/$(dirname "$r")"; cp "$f" "$O/$r"
          done < "$RUNNER_TEMP/app-files.txt"
          for f in $(grep -E 'output-metadata\.json$' "$RUNNER_TEMP/app-files.txt"); do echo "METADATA $f"; cat "$f"; echo; done
          for f in $(grep -E 'AndroidManifest\.xml$' "$RUNNER_TEMP/app-files.txt"); do
            echo "=== GREP $f"; grep -n -B1 -A3 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' "$f"; echo "GREP_COUNT $(grep -c 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' "$f") $f"
            grep -n -m3 -E '<manifest|package=' "$f" | sed 's/^/ROOT /'
          done
          for f in $(grep -E '\.txt$' "$RUNNER_TEMP/app-files.txt"); do
            echo "=== REPORT $f"; grep -n -B2 -A10 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' "$f"; echo "REPORT_COUNT $(grep -c 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' "$f") $f"
          done
          python3 -I - "$RUNNER_TEMP/app-files.txt" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          A = '{http://schemas.android.com/apk/res/android}'
          for f in open(sys.argv[1]).read().split():
              if not f.endswith('AndroidManifest.xml'):
                  continue
              try:
                  r = ET.parse(f).getroot()
              except Exception as e:
                  print('PARSE_FAIL', f, e); continue
              print('FILE', f, 'ROOT_ATTRS', ' '.join('%s="%s"' % (k.replace(A, 'android:'), v) for k, v in r.attrib.items()))
              for tag in ('permission', 'uses-permission'):
                  for el in r.findall(tag):
                      name = el.get(A + 'name') or ''
                      if name.endswith('DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'):
                          print('  ELEMENT <%s> %s' % (tag, ' '.join('%s="%s"' % (k.replace(A, 'android:'), v) for k, v in el.attrib.items())))
          PYEOF
          exit 0
      - name: Upload app manifest outputs and merger reports (reverse temp branch only)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverse-041-arm64Debug-manifest
          path: ${{ runner.temp }}/manifest
          if-no-files-found: warn
          retention-days: 7
      - name: Keep the gradle command's real result as the job result
        if: ${{ !cancelled() && steps.cmd.outputs.rc != '0' }}
        run: exit 1
