name: Render updated goldens

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldens-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
      NOTO_CJK_VERSION: 1:20230817+repack1-3
      NOTO_EMOJI_VERSION: v2.051
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Match ci.yml's font inputs; different glyph versions produce different goldens.
      - name: Restore golden fonts
        id: fonts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-fonts
          key: test-fonts-${{ env.NOTO_CJK_VERSION }}-${{ env.NOTO_EMOJI_VERSION }}
      - name: Download golden fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          apt-get download fonts-noto-cjk="$NOTO_CJK_VERSION" fonts-noto-cjk-extra="$NOTO_CJK_VERSION"
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
          mkdir -p ~/test-fonts
          cp unpacked/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc ~/test-fonts/
          curl -fsSL --retry 3 -o ~/test-fonts/NotoColorEmoji.ttf "https://raw.githubusercontent.com/googlefonts/noto-emoji/$NOTO_EMOJI_VERSION/fonts/NotoColorEmoji.ttf"
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $HOME/test-fonts/NotoColorEmoji.ttf" | sha256sum -c -
      - name: Save golden fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-fonts
          key: ${{ steps.fonts.outputs.cache-primary-key }}
      - name: Install golden fonts
        run: |
          sudo install -Dm644 -t "$DSH_TEST_FONT_DIR" ~/test-fonts/NotoSansCJK-*.ttc
          sudo install -Dm644 ~/test-fonts/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
      - run: flutter pub get --enforce-lockfile
      - name: Record existing golden timestamps
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          before = {p.as_posix(): p.stat().st_mtime_ns for p in Path('test').rglob('*.png') if 'goldens' in p.parts}
          (Path(os.environ['RUNNER_TEMP']) / 'golden-before.json').write_text(json.dumps(before))
          PY
      - name: Run Flutter tests and render new goldens
        id: render
        run: flutter test --no-pub --update-goldens --concurrency=4 --reporter github
      - name: Collect only newly rendered goldens
        if: always() && steps.render.outcome != 'skipped'
        env:
          GOLDEN_TEST_RESULT: ${{ steps.render.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          before = json.loads((temp / 'golden-before.json').read_text())
          out = temp / 'golden-updates'
          out.mkdir()
          rendered = []
          for image in sorted(Path('test').rglob('*.png')):
              if 'goldens' not in image.parts or before.get(image.as_posix()) == image.stat().st_mtime_ns:
                  continue
              target = out / 'app' / image
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(image, target)
              rendered.append(('app' / image).as_posix())
          (out / 'rendered-files.txt').write_text('\n'.join(rendered) + '\n')
          (out / 'STATUS.txt').write_text(
              'commit: ' + os.environ['GITHUB_SHA'] + '\n'
              'flutter-test: ' + os.environ['GOLDEN_TEST_RESULT'] + '\n'
              'new-goldens: ' + str(len(rendered)) + '\n'
              'Update mode renders candidates; review them before replacing baselines.\n')
          if not rendered:
              raise SystemExit('No new golden renders were produced')
          print(f'Collected {len(rendered)} new renders; test result: {os.environ["GOLDEN_TEST_RESULT"]}')
          PY
      - name: Upload new golden renders
        if: always() && steps.render.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-updates-${{ github.sha }}
          path: ${{ runner.temp }}/golden-updates/
          if-no-files-found: error
          retention-days: 7
